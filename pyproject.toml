[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tally"
version = "0.1.0"
description = "A double-entry ledger API where the database guarantees the books always balance."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yitai Huang" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6.100", "httpx2>=2.0", "ruff>=0.6", "testcontainers[postgres]>=4.8"]

[project.scripts]
tally = "tally.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "tally/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
# A warning today is a failure after the next upgrade: fail now, while the cause is fresh.
# This also turns an exception escaping a background thread into a test failure.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["tally"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
