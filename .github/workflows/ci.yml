name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + tests (real Postgres via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q --cov  # fails under 90% branch coverage (pyproject.toml)
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node --test 'tests/js/*.test.js'

  load-test:
    name: Docker Compose + load test + reconciliation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          exit 1
      - name: Concurrent transfers (spread and single hot account)
        run: python3 scripts/load_test.py --requests 2000 --concurrency 30
      - name: The books still balance, recomputed from raw entries
        run: docker compose exec -T app tally reconcile
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
