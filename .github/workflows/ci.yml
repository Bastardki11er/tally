name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; a compromised step can't push or publish.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python }} (real Postgres via Testcontainers)
    # Pinned rather than ubuntu-latest, so the OS changes in a PR of our own, not under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"] # the oldest version pyproject.toml promises, and the one the image runs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -e ".[dev]"
      - if: matrix.python == '3.13'
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest -q --cov # fails under 90% branch coverage (pyproject.toml)
      - if: matrix.python == '3.13'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - if: matrix.python == '3.13'
        run: node --test 'tests/js/*.test.js'

  load-test:
    name: Docker Compose + load test + reconciliation
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack and wait until the app's health check passes
        run: docker compose up -d --build --wait
      - name: Concurrent transfers (fails on any 5xx, timeout or unbalanced books)
        run: python3 scripts/load_test.py --requests 2000 --concurrency 30
      - name: The books still balance, recomputed from raw entries
        run: docker compose exec -T app tally reconcile
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
