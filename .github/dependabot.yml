# Weekly PRs for newer dependencies; each one has to pass CI before it's merged.
version: 2
updates:
  - package-ecosystem: pip # requirements.txt (the pinned runtime) and pyproject.toml
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker # the python base image
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
