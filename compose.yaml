services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      TALLY_DATABASE_URL: postgresql://tally:tally@postgres:5432/tally
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
      POSTGRES_DB: tally
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tally"]
      interval: 3s
      retries: 20
